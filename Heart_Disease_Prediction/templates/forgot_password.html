{% extends "auth_base.html" %}
{% block title %}Forgot Password | CardioAI{% endblock %}

{% block auth_content %}
<div class="glass-card auth-card">

    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-subtitle">Enter your registered email and we'll send you a reset link</p>

    <form method="POST" action="#" novalidate>
        <div class="input-box floating">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" name="email" id="fp_email" placeholder=" " required>
            <label for="fp_email">Email Address</label>
        </div>

        <button type="submit" class="btn-gradient btn-block" disabled title="Feature coming soon">
            <i class="fa-solid fa-paper-plane"></i> Send Reset Link
        </button>
        <p class="auth-note"><i class="fa-solid fa-circle-info"></i> This feature is coming soon.</p>
    </form>

    <p class="auth-switch">
        Remembered your password?
        <a href="{{ url_for('login_page') }}">Back to Login</a>
    </p>

</div>
{% endblock %}
