{% extends "auth_base.html" %}
{% block title %}Login | CardioAI{% endblock %}

{% block auth_content %}
<div class="glass-card auth-card">

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Login to access your heart health dashboard</p>

    <form method="POST" action="{{ url_for('login') }}" id="loginForm" novalidate>

        <div class="input-box floating">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" name="email" id="email" placeholder=" " required>
            <label for="email">Email Address</label>
        </div>

        <div class="input-box floating">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" name="password" id="password" placeholder=" " required>
            <label for="password">Password</label>
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <div class="auth-options">
            <label class="checkbox-label">
                <input type="checkbox" name="remember">
                <span>Remember Me</span>
            </label>
            <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-gradient btn-block">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>

    </form>

    <p class="auth-switch">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one</a>
    </p>

</div>
{% endblock %}
